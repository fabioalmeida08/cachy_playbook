- name: desktop | bspwm | install
  tags:
    - desktop
    - bspwm
  package:
    name: "{{ item }}"
    state: latest
  loop:
    - lightdm
    - lightdm-gtk-greeter
    - bspwm
    - sxhkd
    - nitrogen
    - picom
    - rofi
    - polybar
    - xorg
    - arandr
    - dmenu
    - qt5ct
    - qt6ct
    - lxappearance
    - gnome-themes-extra
    - xdg-user-dirs
  notify:
    - config | bspwm | permission
    - config | qt5ct | theme
    - service | lightdm | enable
    - config | lightdm | greeter
    - config | lightdm | gtk greeter
    - config | xdg | create
    - config | wallpapers | create dir
    - config | wallpapers | unzip
