- name: desktop | bspwm | install packages
  tags: desktop, bspwm
  package:
    name: "{{ item }}"
    state: latest
  loop:
    - lightdm
    - lightdm-gtk-greeter
    - bspwm
    - sxhkd
    - nitrogen
    - picom
    - rofi
    - polybar
    - xorg
    - arandr
    - dmenu
    - qt5ct
    - qt6ct
    - lxappearance
    - gnome-themes-extra
    - xdg-user-dirs
  notify:
    - config | bspwm | execute permission
    - config | qt5ct | desktop env
    - service | lightdm | enable
    - config | lightdm | greeter
    - config | lightdm | gtk greeter
    - xdg | dirs | create
    - wallpapers | create dir
    - wallpapers | unzip
