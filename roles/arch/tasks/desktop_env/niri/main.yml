# 1. Install packages
- name: desktop | niri | install packages
  tags:
    - desktop
    - niri
  become: true
  package:
    name: "{{ item }}"
    state: latest
  loop:
    - wlsunset
    - wpa_supplicant
    - thunar
    - evince
    - ly

# 2. Remove SDDM
- name: service | sddm | disable
  tags: sddm, service
  become: true
  shell: |
    if systemctl is-enabled --quiet sddm 2>/dev/null; then
      systemctl disable sddm
    fi

- name: software | sddm | remove
  tags: sddm, packages
  become: true
  shell: |
    if pacman -Qs sddm > /dev/null; then
      pacman -Rns --noconfirm sddm
    fi

# 3. Enable Ly
- name: service | ly | enable
  tags: service, ly
  become: true
  shell: |
    systemctl enable ly@tty1.service
    systemctl disable getty@tty1.service
