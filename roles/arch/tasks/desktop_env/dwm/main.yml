- name: desktop | dwm | install
  tags:
    - desktop
    - dwm
  package:
    name: "{{ item }}"
    state: latest
  loop:
    - lightdm
    - lightdm-gtk-greeter
    - nitrogen
    - picom
    - xorg
    - arandr
    - dmenu
    - qt5ct
    - qt6ct
    - lxappearance
    - gnome-themes-extra
    - xdg-user-dirs
  notify:
    - config | qt5ct | theme
    - service | lightdm | enable
    - config | lightdm | greeter
    - config | lightdm | gtk greeter
    - config | xdg | create
    - config | wallpapers | create dir
    - config | wallpapers | unzip

- name: desktop | dwm | install
  become_user: "{{ user }}"
  tags:
    - packages
    - dwm
  shell:
    cmd: yay -S dwm --noconfirm
