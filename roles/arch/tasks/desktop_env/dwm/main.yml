- name: desktop | dwm | install packages
  tags: desktop, dwm
  package:
    name: "{{ item }}"
    state: latest
  loop:
    - lightdm
    - lightdm-gtk-greeter
    - nitrogen
    - picom
    - xorg
    - arandr
    - dmenu
    - qt5ct
    - qt6ct
    - lxappearance
    - gnome-themes-extra
    - xdg-user-dirs
  notify:
    - config | qt5ct | desktop env
    - service | lightdm | enable
    - config | lightdm | greeter
    - config | lightdm | gtk greeter
    - xdg | dirs | create
    - wallpapers | create dir
    - wallpapers | unzip

- name: packages | dwm | install
  become_user: "{{ user }}"
  tags: packages, dwm
  shell:
    cmd: yay -S dwm --noconfirm
