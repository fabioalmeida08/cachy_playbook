- name: desktop | i3 | install
  tags:
    - desktop
    - i3
  package:
    name: '{{ item }}'
    state: latest
  loop:
    - xorg
    - lightdm
    - lightdm-gtk-greeter
    - i3-wm
#   - i3lock
    - xss-lock
    - rofi
    - polybar
    - dmenu
    - xdg-utils
    - xdg-user-dirs
    - wireless_tools
    - wpa_supplicant
    - gvfs
    - xdotool
    - redshift
    - lxappearance
    - picom
    - dunst
    - materia-gtk-theme
    - qt5ct
    - qt6ct
    - papirus-icon-theme
    - feh
    - thunar
    - ttf-font-awesome
    - arandr
    - network-manager-applet
    - evince
    - brightnessctl
  notify:
    - service | lightdm | enable
    - xdg | dirs | create
    - config | lightdm | greeter
    - config | lightdm | gtk greeter
    - config | qt5ct | desktop env
    - dotfiles | set
    - wallpapers | extract
    - config | lightdm | wallpaper
    - config | lid | block
    - config | lid | lock when docked
    - config | idle action | ignore
