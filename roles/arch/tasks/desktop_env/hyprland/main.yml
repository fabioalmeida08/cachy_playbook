- name: desktop | hyprland | install
  tags:
    - desktop
    - hyprland
  package:
    name: '{{ item }}'
    state: latest
  loop:
    - hyprland
    - hyprpicker
    - hyprpaper
    - hyperlock
    # - hyprland-themes
    - lightdm
    - lightdm-gtk-greeter
    - dmenu
    - xdg-utils
    - xdg-user-dirs
    - wireless_tools
    - wpa_supplicant
    - gvfs
    - redshift
    - dunst
    - qt5-wayland
    - qt6-wayland
    - xdg-desktop-portal-hyprland
    - thunar
  notify:
    - service | lightdm | enable
    - xdg | dirs | create
    - config | lightdm | greeter
    - config | lightdm | gtk greeter
    - wallpapers | extract
