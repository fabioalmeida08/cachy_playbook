# Hermes Agent - locally-run AI agent (Nous Research)
#
# Only path: the official installer script (CLI only, per-user install in
# ~/.hermes + ~/.local/bin/hermes). On `desktop` the extra `--include-desktop`
# flag also builds the Electron app inside the checkout - that is the app the
# README table lists as desktop-only.
#
# Idempotency comes from `creates`: once ~/.local/bin/hermes exists the task is
# skipped, so re-runs neither re-clone nor rebuild (and `hermes update` stays
# the way to upgrade).
#
# `hermes setup` / `hermes model` are interactive and stay manual - run them
# once after provisioning to pick the provider/API key.

# Host side of the bind mount for the Hermes container: the dir a
# `docker run -v` / compose `volumes:` entry points at. Created together with
# the install so it exists on both setups as soon as Hermes is provisioned,
# even when the `creates` guard below skips the installer (or it fails offline).
# `file` is idempotent - re-runs report ok, not changed.
- name: software | hermes | workspace dir
  tags:
    - hermes
  become_user: "{{ user }}"
  file:
    path: "{{ home }}/hermes-workspace"
    state: directory
    mode: "0755"

- name: software | hermes | install (official script)
  tags:
    - hermes
    - packages
  become_user: "{{ user }}"
  shell:
    cmd: >
      curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s --
      --non-interactive{% if setup == 'desktop' %} --include-desktop{% endif %}
    creates: "{{ home }}/.local/bin/hermes"
