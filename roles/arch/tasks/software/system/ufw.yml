- name: software | ufw | install
  tags:
    - packages
    - ufw
  package:
    name: ufw
    state: latest
  notify:
    - firewall | ufw | enable
    - service | ufw | start

# Guarda para execucoes parciais (ex.: --tags firewall) em maquinas onde o
# ufw ainda nao foi instalado - o modulo falharia com "Failed to find ufw binary".
- name: firewall | ufw | check installed
  tags:
    - always
  stat:
    path: /usr/bin/ufw
  register: ufw_bin

# Precisa ser TASK e nao handler: as tasks rodam antes dos handlers, entao a
# politica e as regras sao gravadas em /etc/ufw/ ANTES de o handler
# `firewall | ufw | enable` ativar o firewall. Sem essa ordem, um
# `ufw enable` em maquina nova usaria as politicas default em silencio.
#
# Incoming e deny total nos DOIS ambientes (desktop e server):
#   - desktop: nenhuma regra extra - bloqueio total, acesso so via console.
#   - server : as regras do tailscale (todas as portas vindas da tailscale0,
#              udp 41641 e routed) sao adicionadas em tailscale.yml.
- name: firewall | ufw | set default deny
  tags:
    - firewall
    - ufw
  ufw:
    default: deny
    direction: incoming
  when: ufw_bin.stat.exists
