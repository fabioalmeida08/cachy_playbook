# Yay AUR helper
- name: software | yay | clone
  tags:
    - packages
    - yay
  become_user: "{{ user }}"
  git:
    repo: https://aur.archlinux.org/yay-bin.git
    dest: "{{ home }}/yay"
    update: true

- name: software | yay | build
  tags:
    - packages
    - yay
  become_user: "{{ user }}"
  command:
    chdir: "{{ home }}/yay"
    cmd: "makepkg -si --noconfirm"
    creates: /usr/bin/yay




