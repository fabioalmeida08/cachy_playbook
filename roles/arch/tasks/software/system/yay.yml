- name: software | yay | clone repo
  tags: packages, yay
  become_user: "{{ user }}"
  git:
    repo: https://aur.archlinux.org/yay-bin.git
    dest: "{{ home }}/yay"
    update: true

- name: software | yay | build and install
  tags: packages, yay
  become_user: "{{ user }}"
  command:
    chdir: "{{ home }}/yay"
    cmd: "makepkg -si --noconfirm"
    creates: /usr/bin/yay




