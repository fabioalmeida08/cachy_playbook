- name: software | themes | install
  tags:
    - packages
    - themes
  package:
    name: "{{ item }}"
    state: latest
  loop:
    - qt5ct
    - qt6ct
    - gnome-themes-extra
    - papirus-icon-theme
    - dconf
    - dconf-editor

