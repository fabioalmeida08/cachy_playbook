- name: software | themes | install
  tags:
    - packages
    - themes
  package:
    name: "{{ item }}"
    state: latest
  loop:
    - qt5ct
    - qt6ct
    - gnome-themes-extra
    - papirus-icon-theme
    - dconf
    - dconf-editor
    # niri/Noctalia desktop look (shipped by the CachyOS niri ISO profile)
    - adw-gtk-theme
    - capitaine-cursors
    # GTK settings editor (fonts, theme, icons, cursors) for Wayland compositors
    - nwg-look

