- name: config | autostart | desktop
  tags:
    - config
    - autostart
  lineinfile:
    path: "{{ home }}/.config/autostart/modmap.desktop"
    regexp: "^Exec"
    line: "Exec={{ home }}/.scripts/modmap.sh"

- name: config | ssh | github key
  tags:
    - ssh
    - github
  become_user: "{{ user }}"
  ansible.builtin.command:
    cmd: ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N ''
