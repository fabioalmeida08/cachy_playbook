- name: config | dnsmasq | cache
  tags:
    - config
    - dns
  lineinfile:
    path: "/etc/dnsmasq.conf"
    regexp: "^#listen-address="
    line: listen-address=::1,127.0.0.1

- name: service | dnsmasq | start
  tags:
    - service
    - dnsmasq
  service:
    name: dnsmasq
    state: started
    enabled: yes
