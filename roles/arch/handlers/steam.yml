- name: config | steam | eg-proton dir
  tags:
    - steam
    - eg-proton
  file:
    path: '{{ home }}/.local/share/Steam/compatibilitytools.d'
    owner: '{{ user }}'
    group: '{{ user }}'
    state: directory
    mode: '0764'

- name: software | proton-ge | get tag
  tags:
    - steam
    - proton-ge
  uri:
    url: 'https://api.github.com/repos/GloriousEggroll/proton-ge-custom/releases/latest'
    return_content: yes
    headers:
      Accept: 'application/vnd.github.v3+json'
  register: release_info

- name: software | proton-ge | install
  tags:
    - steam
    - proton-ge
  unarchive:
    src: 'https://github.com/GloriousEggroll/proton-ge-custom/archive/{{ release_info.json.tag_name }}.tar.gz'
    dest: '{{ home }}/.local/share/Steam/compatibilitytools.d'
    remote_src: yes
    owner: '{{ user }}'
    group: '{{ user }}'
    mode: '0755'

- name: software | mangohud | install
  tags:
    - steam
    - mangohud
  package:
    name: '{{ item }}'
    state: latest
  loop:
    - mangohud
    - lib32-mangohud

# Steam gaming handlers
- name: config | mangohud | system
  tags:
    - config
    - mangohud
  lineinfile:
    path: '/etc/environment'
    line: MANGOHUD=1
