- name: config | wallpapers | create user dir
  tags:
    - wallpapers
  file:
    path: "{{ home }}/Wallpapers"
    state: directory
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: "0764"

- name: config | wallpapers | unzip to user home
  tags:
    - wallpapers
  unarchive:
    src: "wallpapers.tar.gz"
    dest: "{{ home }}/Wallpapers"
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: "0764"
    extra_opts:
      - --strip-components=1
