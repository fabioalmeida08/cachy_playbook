# Wallpaper management handlers
- name: config | wallpapers | create dir
  tags:
    - wallpapers
  file:
    path: "/usr/share/wallpapers"
    state: directory
    mode: "0755"

- name: config | wallpapers | unzip
  tags:
    - wallpapers
  unarchive:
    src: "wallpapers.tar.gz"
    dest: "/usr/share/wallpapers"
    mode: "0744"

