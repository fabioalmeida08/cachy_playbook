- hosts: localhost
  connection: local
  become: true
  vars:
    distro: "{{ ansible_facts['distribution'] }}"
    # desktop | server - passed by bootstrap.sh via -e, or exported as SETUP.
    # Controls firewall rules, GUI packages and the Hermes desktop app.
    setup: "{{ lookup('env', 'SETUP') | default('desktop', true) }}"

  pre_tasks:
    - name: config | pre-run | check requirements
      tags: always
      package:
        name: "{{ item }}"
        state: latest
      loop:
        - python-psutil
        - python-pip
        - python-setuptools

    - name: config | multilib | enable
      replace:
        path: "/etc/pacman.conf"
        regexp: '#\[multilib]\n#Include = \/etc\/pacman.d\/mirrorlist'
        replace: |
          [multilib]
          Include = /etc/pacman.d/mirrorlist
      # lib32-* (steam, gamemode, intel-gfx) are desktop-only
      when: distro == 'Archlinux' and setup == 'desktop'

    - name: system | pacman | update
      pacman:
        update_cache: true
        upgrade: true

- hosts: localhost
  tags: arch
  vars:
    home: "/home/{{ ansible_facts['env']['SUDO_USER'] }}"  # Correção aqui
    user: "{{ ansible_facts['env']['SUDO_USER'] }}"
    ipaddr: "{{ ansible_facts['default_ipv4']['address'] }}"
    # desktop | server (redefined here: play vars are not shared across plays)
    setup: "{{ lookup('env', 'SETUP') | default('desktop', true) }}"
  become: true
  roles:
    - arch
